# Author: Maurizio Verde — LastReload
# Tests on every push / PR (no model, no secrets). The real-model job (llama-server on CPU + Qwen3-0.6B) runs only on
# demand: Actions → ci → Run workflow.
name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      llama:
        description: "also run the llama-server CPU job (Qwen3-0.6B)"
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install (pip install .)
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install .
      - name: unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: mnemonic-proxy demo (installed command)
        run: |
          cd /tmp
          /tmp/venv/bin/mnemonic-proxy demo
          /tmp/venv/bin/ctxproxy demo > /dev/null
      - name: mnemonic-proxy check against the fake engine
        run: |
          cd /tmp
          /tmp/venv/bin/python -m ctxproxy.fake_engine --flavor llama --n-ctx 32768 --port 18095 &
          /tmp/venv/bin/python -m ctxproxy.fake_engine --flavor llama --n-ctx 8192 --port 18097 &
          for i in $(seq 1 50); do curl -sf localhost:18095/health > /dev/null && curl -sf localhost:18097/health > /dev/null && break; sleep 0.2; done
          mkdir -p slots
          cp "$GITHUB_WORKSPACE/examples/config.llama-server.json" .
          /tmp/venv/bin/mnemonic-proxy check --json --upstream http://127.0.0.1:18095 --port 18096 \
            --data ./data --config config.llama-server.json | tee check.json || true
          /tmp/venv/bin/python -c "import json; d = json.load(open('check.json')); assert d['ready'] and d['exit_code'] == 0, d"
          # windows below 16K are refused (0.3.0)
          /tmp/venv/bin/mnemonic-proxy check --json --upstream http://127.0.0.1:18097 --port 18096 \
            --data ./data --config config.llama-server.json > check8k.json || true
          /tmp/venv/bin/python -c "import json; d = json.load(open('check8k.json')); assert not d['ready'] and d['exit_code'] == 1, d"
          # llama-server router mode (0.3.7): detected, ready, window per model
          /tmp/venv/bin/python -m ctxproxy.fake_engine --flavor router --models big=65536,small=16384 --port 18098 &
          for i in $(seq 1 50); do curl -sf localhost:18098/health > /dev/null && break; sleep 0.2; done
          /tmp/venv/bin/mnemonic-proxy check --json --upstream http://127.0.0.1:18098 --port 18096 \
            --data ./data --config config.llama-server.json > check-router.json || true
          /tmp/venv/bin/python -c "import json; d = json.load(open('check-router.json')); assert d['ready'] and d['exit_code'] == 0, d; assert any('router mode' in c['evidence'] for c in d['checks']), d"

  # PyPI package (0.3.2): sdist + wheel built once, twine check, then the wheel installed in a clean venv on Linux
  # and Windows (pip and uvx). Nothing is uploaded here: publishing is publish.yml, on a GitHub release.
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: build + twine check
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
          python -m zipfile -l dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  package-install:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v6
      - name: pip install the wheel in a clean venv, demo, mnemonic-mcp --help
        env:
          PYTHONIOENCODING: ${{ runner.os == 'Windows' && 'cp1252' || '' }}
        run: |
          python -m venv "$RUNNER_TEMP/pkgvenv"
          if [ "$RUNNER_OS" = Windows ]; then BIN="$RUNNER_TEMP/pkgvenv/Scripts"; else BIN="$RUNNER_TEMP/pkgvenv/bin"; fi
          "$BIN/python" -m pip install dist/*.whl
          "$BIN/python" -c "import ctxproxy; print(ctxproxy.__version__)"
          cd "$RUNNER_TEMP"
          "$BIN/mnemonic-proxy" demo | tee demo.txt
          grep -q PASS demo.txt
          "$BIN/mnemonic-mcp" --help > /dev/null
      - name: uvx from the wheel
        run: |
          WHL=$(ls "$PWD"/dist/*.whl)
          cd "$RUNNER_TEMP"
          uvx --python ${{ matrix.python }} --from "$WHL" mnemonic-proxy demo | tee uvx.txt
          grep -q PASS uvx.txt

  llama-cpu:
    if: github.event_name == 'workflow_dispatch' && inputs.llama
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LLAMA_TAG: b11430
      MODEL_URL: https://huggingface.co/ggml-org/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B-Q8_0.gguf
      MODEL_SHA256: 361cc68159042c36ebff7715dc5a2e4612153e88f3e9c9c234820849d6dc9e1d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: cache llama.cpp build
        id: llama-cache
        uses: actions/cache@v4
        with:
          path: llama.cpp/build/bin
          key: llama-${{ env.LLAMA_TAG }}-cpu-ubuntu-24.04-nonnative
      # GGML_NATIVE=OFF: the cache is shared by runners with different CPUs; a -march=native build from an
      # AVX-512 runner dies with "Illegal instruction" on one without it
      - name: build llama-server ${{ env.LLAMA_TAG }} (CPU, portable)
        if: steps.llama-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$LLAMA_TAG" https://github.com/ggml-org/llama.cpp
          cmake -S llama.cpp -B llama.cpp/build -DCMAKE_BUILD_TYPE=Release -DLLAMA_BUILD_TESTS=OFF -DGGML_NATIVE=OFF
          cmake --build llama.cpp/build --config Release -j "$(nproc)" --target llama-server
      - name: cache model
        uses: actions/cache@v4
        with:
          path: models
          key: model-${{ env.MODEL_SHA256 }}
      - name: download model (checksum verified)
        run: |
          mkdir -p models
          [ -f models/model.gguf ] || curl -fL -o models/model.gguf "$MODEL_URL"
          echo "$MODEL_SHA256  models/model.gguf" | sha256sum -c -
      - name: install
        run: python -m pip install .
      - name: engine
        run: |
          mkdir -p slots data
          llama.cpp/build/bin/llama-server -m models/model.gguf -c 32768 --parallel 1 --jinja \
            --slot-save-path ./slots --port 8095 > engine.log 2>&1 &
          for i in $(seq 1 120); do curl -sf localhost:8095/health > /dev/null && break; sleep 1; done
          curl -sf localhost:8095/health
      - name: mnemonic-proxy check --live
        run: |
          mnemonic-proxy check --live --upstream http://127.0.0.1:8095 --port 8096 --data ./data \
            --config examples/config.llama-server.json
      - name: proxy + chat round trip + saved state
        run: |
          sed 's#"./slots"#"'"$PWD"'/slots"#' examples/config.llama-server.json > cfg.json
          mnemonic-proxy --upstream http://127.0.0.1:8095 --port 8096 --data ./data --config cfg.json > proxy.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8096/health > /dev/null && break; sleep 1; done
          curl -sf localhost:8096/v1/engine
          curl -sf localhost:8096/v1/chat/completions -H 'Content-Type: application/json' \
            -d '{"model": "m", "max_tokens": 32, "messages": [{"role": "user", "content": "Say hello. /no_think"}]}'
          grep -q '"event": "request"' data/journal.jsonl
      - name: logs
        if: always()
        run: tail -n 50 engine.log proxy.log || true
      - name: saved state end to end (restart, restore from disk vs re-read, kv_archive)
        if: success() || failure()
        run: python tools/state_e2e.py --server llama.cpp/build/bin/llama-server --model models/model.gguf --work e2e --kv-archive
      - name: e2e logs
        if: always()
        run: |
          cat e2e/state_e2e.json || true
          tail -n 40 e2e/engine.log e2e/proxy.log || true

  # Native Windows (no WSL): unit tests, demo and check against the fake engine, in PowerShell.
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install (pip install .)
        run: |
          python -m venv $env:RUNNER_TEMP\venv
          & $env:RUNNER_TEMP\venv\Scripts\pip.exe install .
      - name: unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: mnemonic-proxy demo (installed command, cp1252 console)
        env:
          PYTHONIOENCODING: cp1252
        run: |
          Set-Location $env:RUNNER_TEMP
          & $env:RUNNER_TEMP\venv\Scripts\mnemonic-proxy.exe demo
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $env:RUNNER_TEMP\venv\Scripts\ctxproxy.exe demo | Out-Null
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: mnemonic-proxy check against the fake engine
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          Set-Location $env:RUNNER_TEMP
          $py = "$env:RUNNER_TEMP\venv\Scripts\python.exe"
          $mp = "$env:RUNNER_TEMP\venv\Scripts\mnemonic-proxy.exe"
          Start-Process -FilePath $py -ArgumentList "-m","ctxproxy.fake_engine","--flavor","llama","--n-ctx","32768","--port","18095" -RedirectStandardOutput fe1.log -RedirectStandardError fe1.err.log
          Start-Process -FilePath $py -ArgumentList "-m","ctxproxy.fake_engine","--flavor","llama","--n-ctx","8192","--port","18097" -RedirectStandardOutput fe2.log -RedirectStandardError fe2.err.log
          foreach ($i in 1..50) { try { Invoke-RestMethod http://127.0.0.1:18095/health | Out-Null; Invoke-RestMethod http://127.0.0.1:18097/health | Out-Null; break } catch { Start-Sleep -Milliseconds 200 } }
          New-Item -ItemType Directory -Force slots | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\examples\config.llama-server.json" .
          & $mp check --json --upstream http://127.0.0.1:18095 --port 18096 --data .\data --config config.llama-server.json | Tee-Object -FilePath check.json
          & $py -c "import json; d = json.load(open('check.json')); assert d['ready'] and d['exit_code'] == 0, d"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # windows below 16K are refused (0.3.0)
          & $mp check --json --upstream http://127.0.0.1:18097 --port 18096 --data .\data --config config.llama-server.json | Out-File -Encoding utf8 check8k.json
          & $py -c "import json; d = json.load(open('check8k.json', encoding='utf-8-sig')); assert not d['ready'] and d['exit_code'] == 1, d"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          exit 0

  # Native Windows with the official llama.cpp Windows CPU build (llama-server.exe) and Qwen3-0.6B.
  llama-windows:
    if: github.event_name == 'workflow_dispatch' && inputs.llama
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      LLAMA_TAG: b11430
      LLAMA_ZIP: llama-b11430-bin-win-cpu-x64.zip
      LLAMA_SHA256: b608455b0109793f774537d63d15d4cf2098ddbc5b200ebc9a648e1d85369666
      MODEL_URL: https://huggingface.co/ggml-org/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B-Q8_0.gguf
      MODEL_SHA256: 361cc68159042c36ebff7715dc5a2e4612153e88f3e9c9c234820849d6dc9e1d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: download llama.cpp ${{ env.LLAMA_TAG }} Windows CPU (checksum verified)
        run: |
          Invoke-WebRequest -Uri "https://github.com/ggml-org/llama.cpp/releases/download/$env:LLAMA_TAG/$env:LLAMA_ZIP" -OutFile llama.zip
          $h = (Get-FileHash llama.zip -Algorithm SHA256).Hash.ToLower()
          if ($h -ne $env:LLAMA_SHA256) { throw "llama.cpp zip sha256 $h != $env:LLAMA_SHA256" }
          Expand-Archive llama.zip -DestinationPath llama
          $exe = Get-ChildItem -Recurse llama -Filter llama-server.exe | Select-Object -First 1
          "LLAMA_SERVER=$($exe.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          & $exe.FullName --version
      - name: cache model
        uses: actions/cache@v4
        with:
          path: models
          key: model-${{ env.MODEL_SHA256 }}
      - name: download model (checksum verified)
        run: |
          New-Item -ItemType Directory -Force models | Out-Null
          if (-not (Test-Path models\model.gguf)) { Invoke-WebRequest -Uri $env:MODEL_URL -OutFile models\model.gguf }
          $h = (Get-FileHash models\model.gguf -Algorithm SHA256).Hash.ToLower()
          if ($h -ne $env:MODEL_SHA256) { throw "model sha256 $h != $env:MODEL_SHA256" }
      - name: install
        run: python -m pip install .
      # one step: on Windows runners the processes a step starts are killed when the step ends
      - name: engine (llama-server.exe --slot-save-path .\slots), check --live, proxy + chat round trip
        run: |
          New-Item -ItemType Directory -Force slots, data | Out-Null
          $e = Start-Process -FilePath $env:LLAMA_SERVER -ArgumentList "-m","models\model.gguf","-c","32768","--parallel","1","--jinja","--slot-save-path",".\slots","--port","8095" -RedirectStandardOutput engine.log -RedirectStandardError engine.err.log -PassThru
          foreach ($i in 1..180) { try { Invoke-RestMethod http://127.0.0.1:8095/health | Out-Null; break } catch { Start-Sleep 1 } }
          Invoke-RestMethod http://127.0.0.1:8095/health
          # slot_dir .\slots = --slot-save-path .\slots
          mnemonic-proxy check --live --upstream http://127.0.0.1:8095 --port 8096 --data .\data --config examples\config.llama-server.json
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $p = Start-Process -FilePath mnemonic-proxy -ArgumentList "--upstream","http://127.0.0.1:8095","--port","8096","--data",".\data","--config","examples\config.llama-server.json" -RedirectStandardOutput proxy.log -RedirectStandardError proxy.err.log -PassThru
          foreach ($i in 1..30) { try { Invoke-RestMethod http://127.0.0.1:8096/health | Out-Null; break } catch { Start-Sleep 1 } }
          Invoke-RestMethod http://127.0.0.1:8096/v1/engine | ConvertTo-Json -Depth 5
          $body = '{"model": "m", "max_tokens": 32, "messages": [{"role": "user", "content": "Say hello. /no_think"}]}'
          $r = Invoke-RestMethod -Method Post -Uri http://127.0.0.1:8096/v1/chat/completions -ContentType 'application/json' -Body $body
          $r | ConvertTo-Json -Depth 6
          if (-not (Select-String -Path data\journal.jsonl -Pattern '"event": "request"' -Quiet)) { throw "no request in the journal" }
          Stop-Process -Id $p.Id
          Stop-Process -Id $e.Id
      - name: saved state end to end (restart, restore from disk vs re-read, kv_archive)
        if: success() || failure()
        run: |
          python tools\state_e2e.py --server $env:LLAMA_SERVER --model models\model.gguf --work e2e --kv-archive
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: examples\start-windows.bat (engine + check + proxy, as a user would start them)
        if: success() || failure()
        run: |
          $env:LLAMA = $env:LLAMA_SERVER
          $env:MODEL = "$env:GITHUB_WORKSPACE\models\model.gguf"
          $env:VENV = "$env:RUNNER_TEMP\mvenv"
          python -m venv $env:VENV
          & "$env:VENV\Scripts\pip.exe" install --quiet .
          $b = Start-Process -FilePath cmd.exe -ArgumentList "/c","examples\start-windows.bat" -RedirectStandardOutput bat.log -RedirectStandardError bat.err.log -PassThru
          $ok = $false
          foreach ($i in 1..120) { try { Invoke-RestMethod http://127.0.0.1:8096/health | Out-Null; $ok = $true; break } catch { Start-Sleep 1 } }
          Get-Content bat.log, bat.err.log -ErrorAction SilentlyContinue
          if (-not $ok) { throw "the proxy started by start-windows.bat does not answer on 8096" }
          $body = '{"model": "m", "max_tokens": 16, "messages": [{"role": "user", "content": "Say hi. /no_think"}]}'
          Invoke-RestMethod -Method Post -Uri http://127.0.0.1:8096/v1/chat/completions -ContentType 'application/json' -Body $body | ConvertTo-Json -Depth 6
          if (-not (Test-Path examples\slots) -or -not (Test-Path examples\data\journal.jsonl)) { throw "slots or data not created next to the .bat" }
          Get-Process mnemonic-proxy, llama-server -ErrorAction SilentlyContinue | Stop-Process
      - name: logs
        if: always()
        run: |
          Get-Content e2e\state_e2e.json -ErrorAction SilentlyContinue
          foreach ($f in "engine.log","engine.err.log","proxy.log","proxy.err.log","e2e\engine.log","e2e\proxy.log") { if (Test-Path $f) { "== $f"; Get-Content $f -Tail 40 } }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: llama-windows-e2e
          path: |
            e2e/state_e2e.json
            e2e/engine.log
            e2e/proxy.log
            e2e/data/journal.jsonl
            engine.log
            engine.err.log
            proxy.log
            proxy.err.log
