; llama-server router mode preset for mnemonic-proxy (llama.cpp b11723 or newer).
; Start:  llama-server --models-preset preset.router.example.ini --models-max 1 --port 8095
; Proxy:  mnemonic-proxy --upstream http://127.0.0.1:8095 --port 8096 --data ./data \
;           --config config.llama-server-router.json
; The client's "model" picks the section below ([qwen], [gemma]: use your own names and paths).
version = 1

[*]
; every model: one slot, saved state in the same folder as "slot_dir" in the proxy config
parallel = 1
slot-save-path = ./slots
jinja = true

[qwen]
model = /path/to/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
; c = --ctx-size: the window of this model, at least 16384 (the proxy reads it per model)
c = 65536

[gemma]
model = /path/to/gemma-4-E2B-it-Q8_0.gguf
c = 32768
