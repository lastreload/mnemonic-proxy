[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "virtual-context-proxy"
version = "0.1.0"
description = "OpenAI-compatible proxy that gives Strata a virtual context: stable-frontier masking, exact recall archive, segments with handoff notes, autosave/autorestore."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Maurizio Verde" }]
requires-python = ">=3.10"
dependencies = []   # standard library only (sqlite3 with FTS5)

[project.optional-dependencies]
exact = ["tokenizers>=0.15"]   # exact token counting with the Strata pack tokenizer

[project.scripts]
ctxproxy = "ctxproxy.server:main"

[tool.setuptools]
packages = ["ctxproxy"]
